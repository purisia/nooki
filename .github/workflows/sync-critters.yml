name: Sync critters from Nookipedia

on:
  schedule:
    # Daily at 18:00 UTC == 03:00 KST
    - cron: '0 18 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run sync script
        id: sync
        run: |
          node scripts/sync-critters.mjs | tee /tmp/sync.log
          if git diff --quiet -- src/data/critters.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Pull Request
        if: steps.sync.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: 'data: sync new critters from Nookipedia'
          branch: bot/sync-critters
          delete-branch: true
          title: '🐛🐟 Sync new critters from Nookipedia'
          body: |
            Nookipedia Cargo extension에서 신규 종 자동 감지.

            **검수 포인트:**
            - `src/data/critters.json`은 영문 canonical(자동 덮어쓰기). 수동 편집 X.
            - 추가된 종의 영문명을 `src/data/overlay.json`에 한국어 이름과 함께 매핑 추가 — 안 하면 UI에 "⚠️ 영문명" 뱃지로 표시됨.
            - 특수 출현 조건(교배꽃/바위치기 등)·날씨(비/눈)·설명은 overlay 의 `condition`/`rainOnly`/`desc` 로 등록.

            <details>
            <summary>스크립트 로그</summary>

            ```
            $(cat /tmp/sync.log 2>/dev/null || echo "no log")
            ```
            </details>
          labels: |
            data
            automated
